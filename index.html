<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Sunce Marinković — Portal za praćenje naloga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700,900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS — one warm-monochrome system, shared by the
   public search and the admin panel. A single muted accent
   (terracotta) carries brand + interactive state; status color
   is semantic and separate from it.
   ============================================================ */
:root{
  --paper:#FAFAFA;
  --panel:#FFFFFF;
  --sidebar:#EFEFEE;
  --ink:#363939;
  --ink-soft:#6E7171;      /* zvanična SUNCE siva (Futro sistem boja, 100%) */
  --line:#E9EAEA;          /* zvanična siva, 25% */
  --line-strong:#D3D4D4;   /* zvanična siva, 50% */

  --steel:#E9B54A;         /* zvanična SUNCE zlatna (Futro sistem boja, 100%) */
  --steel-dark:#9B6E13;
  --steel-tint:#F9E9C9;    /* zvanična zlatna, 50% */

  --amber:#A15D14;        /* due soon / changed — namerno odvojeno od brend zlatne */
  --amber-tint:#F5E3CE;
  --green:#3C6B45;        /* on track / success */
  --green-tint:#E9F1E9;
  --red:#A13B32;          /* overdue / error */
  --red-tint:#F8E7E4;

  --radius:8px;
  --radius-lg:12px;
  --font-display:'Satoshi','Inter Tight',system-ui,sans-serif;
  --font-body:'Satoshi','Inter Tight',system-ui,sans-serif;
  --font-hero:'Fraunces',serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.55;
}
#root{min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--steel-tint);color:var(--steel-dark);}

h1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;font-weight:700;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.muted{color:var(--ink-soft);}
.small{font-size:12px;}
.xsmall{font-size:11px;}

/* ---------- layout shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:224px;flex-shrink:0;
  background:var(--sidebar);
  color:var(--ink);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sidebar-brand{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--line);
}
.sidebar-brand .name{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:0.01em;}
.sidebar-brand .sub{font-size:11px;color:var(--ink-soft);margin-top:2px;text-transform:uppercase;letter-spacing:0.07em;}
.sidebar-brand-row{display:flex;align-items:center;gap:8px;}
.sidebar-nav{padding:14px 10px;flex:1;overflow-y:auto;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;margin-bottom:2px;
  border-radius:6px;
  color:var(--ink-soft);font-size:13px;font-weight:500;
  cursor:pointer;
  border-left:2px solid transparent;
}
.nav-item:hover{background:rgba(0,0,0,0.03);color:var(--ink);}
.nav-item.active{background:var(--steel-tint);color:var(--steel-dark);border-left-color:var(--steel);font-weight:600;}
.nav-section{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin:16px 12px 6px;opacity:0.7;}
.sidebar-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-soft);}
.sidebar-foot button{
  margin-top:8px;background:none;border:1px solid var(--line-strong);
  color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;
}
.sidebar-foot button:hover{background:var(--panel);border-color:var(--steel);}

.main{flex:1;min-width:0;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:18px;}
.content{padding:24px 28px 60px;max-width:1180px;}

/* ---------- generic components ---------- */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.stat{
  background:var(--panel);border:1px solid var(--line);padding:16px 18px;border-radius:var(--radius-lg);
}
.stat .label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:8px;}
.stat .value{font-family:var(--font-display);font-size:26px;font-weight:700;}
.stat .value.amber{color:var(--amber);}
.stat .value.green{color:var(--green);}
.stat .value.steel{color:var(--steel);}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:var(--radius);border:1px solid var(--ink);
  background:var(--ink);color:#fff;font-size:13px;font-weight:600;cursor:pointer;
  transition:background .15s ease,transform .1s ease;
}
.btn:hover{background:#333;}
.btn:active{transform:scale(0.98);}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line-strong);}
.btn.secondary:hover{background:var(--panel);border-color:var(--steel);color:var(--steel-dark);}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1px solid transparent;padding:6px 10px;}
.btn.ghost:hover{color:var(--ink);text-decoration:underline;}
.btn.danger{background:var(--red);border-color:var(--red);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn.small{padding:6px 12px;font-size:12px;}

input[type=text],input[type=email],input[type=tel],input[type=password],select{
  padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--radius);
  font-family:inherit;font-size:13px;background:#fff;color:var(--ink);
}
input:focus,select:focus,button:focus,.nav-item:focus{outline:2px solid var(--steel);outline-offset:1px;}
label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
.field{margin-bottom:14px;}

.badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:0.03em;
}
.badge .dot{width:6px;height:6px;border-radius:50%;}
.badge.status-overdue{background:var(--red-tint);color:var(--red);}
.badge.status-overdue .dot{background:var(--red);}
.badge.status-today{background:var(--amber-tint);color:var(--amber);}
.badge.status-today .dot{background:var(--amber);}
.badge.status-planned{background:var(--steel-tint);color:var(--steel-dark);}
.badge.status-planned .dot{background:var(--steel);}
.badge.status-nodate{background:#EFECE4;color:var(--ink-soft);}
.badge.status-nodate .dot{background:var(--ink-soft);}
.badge.status-success{background:var(--green-tint);color:var(--green);}
.badge.status-success .dot{background:var(--green);}
.badge.status-error{background:var(--red-tint);color:var(--red);}
.badge.status-error .dot{background:var(--red);}
.badge.status-new{background:var(--green-tint);color:var(--green);}
.badge.status-changed{background:var(--amber-tint);color:var(--amber);}
.badge.status-unchanged{background:#EFECE4;color:var(--ink-soft);}
.badge.status-missing{background:#EFECE4;color:var(--ink-soft);}

table{width:100%;border-collapse:collapse;}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
  color:var(--ink-soft);padding:9px 12px;border-bottom:1px solid var(--line-strong);
  white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
tr:hover td{background:var(--paper);}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:#fff;}

.section-title{
  display:flex;align-items:baseline;gap:10px;margin:30px 0 12px;
}
.section-title h2{font-size:14px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:700;}
.section-title .rule{flex:1;height:1px;background:var(--line);}

.order-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:16px 18px;margin-bottom:10px;cursor:pointer;
  transition:border-color .12s ease;
}
.order-card:hover{border-color:var(--steel);}
.order-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.order-card .oid{font-family:var(--font-mono);font-weight:600;font-size:15px;}
.order-card .meta{color:var(--ink-soft);font-size:12px;margin-top:2px;}
.order-card .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.countdown{font-family:var(--font-mono);font-weight:700;font-size:13px;}
.countdown.amber{color:var(--amber);}
.countdown.red{color:var(--red);}
.countdown.steel{color:var(--steel);}

.empty-state{
  text-align:center;padding:56px 20px;color:var(--ink-soft);border:1px dashed var(--line-strong);border-radius:var(--radius-lg);background:#fff;
}
.empty-state h3{font-size:15px;color:var(--ink);margin-bottom:6px;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(20,18,15,0.45);
  display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;
  overflow-y:auto;z-index:50;
}
.modal{background:#fff;border-radius:var(--radius-lg);max-width:760px;width:100%;padding:26px 28px;margin-bottom:40px;}

.tag-pill{
  display:inline-flex;align-items:center;gap:6px;background:var(--steel-tint);color:var(--steel-dark);
  padding:3px 9px;border-radius:20px;font-size:12px;font-family:var(--font-mono);margin:2px 4px 2px 0;
}
.tag-pill button{background:none;border:none;color:var(--steel-dark);cursor:pointer;font-size:13px;line-height:1;padding:0;}

.step-list{display:flex;gap:0;margin-bottom:22px;}
.step{flex:1;text-align:center;padding:10px 6px;border-bottom:3px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
.step.active{border-color:var(--steel);color:var(--steel-dark);font-weight:700;}
.step.done{border-color:var(--green);color:var(--green);}

.timeline{list-style:none;margin:0;padding:0;}
.timeline li{
  display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;
}
.timeline li:last-child{border-bottom:none;}
.timeline .tdot{width:8px;height:8px;border-radius:50%;background:var(--steel);margin-top:5px;flex-shrink:0;}

.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 480px at 15% -10%, var(--steel-tint) 0%, transparent 60%),
    var(--paper);
  padding:20px;
}
.login-card{
  background:#fff;border:1px solid var(--line);width:100%;max-width:420px;padding:34px 32px;border-radius:var(--radius-lg);
}
.login-brand{margin-bottom:26px;display:flex;flex-direction:column;gap:10px;}
.login-brand .name{font-family:var(--font-hero);font-weight:600;font-size:24px;letter-spacing:-0.01em;}
.login-brand .sub{color:var(--ink-soft);font-size:13px;margin-top:-4px;}
.role-toggle{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;}
.role-toggle button{
  flex:1;padding:9px;background:#fff;border:none;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
}
.role-toggle button.active{background:var(--steel);color:#fff;}
.customer-pick{
  border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
}
.customer-pick:hover{border-color:var(--steel);background:var(--steel-tint);}

.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end;}
.filters-bar .field{margin-bottom:0;}

.diff-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;}
.diff-row:last-child{border-bottom:none;}
.diff-old{color:var(--red);text-decoration:line-through;font-family:var(--font-mono);}
.diff-new{color:var(--green);font-weight:600;font-family:var(--font-mono);}
.diff-arrow{color:var(--ink-soft);}

.note-block{background:var(--amber-tint);border:1px solid #E2C6A0;color:#5C3A0C;padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;}
.callout{background:var(--steel-tint);border:1px solid #F0D98A;padding:10px 12px;border-radius:var(--radius);font-size:12px;color:var(--steel-dark);margin-bottom:14px;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--ink-soft);}
.kv .v{font-weight:600;text-align:right;}

.progress-track{width:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px;}
.progress-fill{height:100%;background:var(--steel);transition:width .3s ease;}

.hint{font-size:11px;color:var(--ink-soft);margin-top:4px;}

@media (max-width: 860px){
  .sidebar{position:fixed;left:-224px;transition:left .18s ease;z-index:40;}
  .sidebar.open{left:0;}
  .content{padding:16px 14px 60px;}
  .topbar{padding:12px 14px;}
  .stat-row{grid-template-columns:1fr 1fr;}
  .grid-2,.grid-3{grid-template-columns:1fr;}
  table.desktop-only{display:none;}
  .mobile-cards{display:block;}
}
@media (min-width: 861px){
  .mobile-cards{display:none;}
}
.menu-btn{display:none;background:none;border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 9px;cursor:pointer;}
@media (max-width:860px){.menu-btn{display:inline-flex;}}

/* ============================================================
   PUBLIC SEARCH — same design system as admin, just a different
   layout shape (guided search instead of a sidebar). No separate
   color theme: one accent, one voice, everywhere.
   ============================================================ */
.public-app{
  min-height:100vh;
  background:
    radial-gradient(1000px 520px at 100% -12%, var(--steel-tint) 0%, transparent 55%),
    var(--paper);
  font-family:var(--font-body);
}
.pub-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 30px;border-bottom:1px solid var(--line);
}
.pub-brand{display:flex;align-items:center;gap:10px;}
.pub-brand-name{font-family:var(--font-display);font-weight:700;font-size:14.5px;letter-spacing:0.01em;}
.pub-brand-sub{font-size:10.5px;color:var(--ink-soft);letter-spacing:0.06em;text-transform:uppercase;}
.pub-week-chip{
  background:#fff;border:1px solid var(--line);border-radius:100px;padding:7px 14px;
  font-size:12.5px;font-weight:600;color:var(--ink-soft);display:flex;gap:9px;align-items:center;
}
.pub-week-chip b{color:var(--ink);}
.pub-week-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--steel);}
.pub-admin-link{
  background:none;border:1px solid var(--line-strong);color:var(--ink-soft);
  font-size:12px;font-weight:600;padding:7px 13px;border-radius:100px;cursor:pointer;margin-left:10px;
}
.pub-admin-link:hover{border-color:var(--steel);color:var(--steel-dark);}

.pub-main{max-width:860px;margin:0 auto;padding:52px 22px 80px;}
.pub-eyebrow{font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--steel-dark);margin-bottom:14px;}
.pub-h1{font-family:var(--font-hero);font-weight:600;font-size:38px;line-height:1.12;margin:0 0 14px;letter-spacing:-0.015em;}
.pub-lead{font-size:15px;color:var(--ink-soft);max-width:540px;margin:0 0 38px;line-height:1.6;}
.pub-back{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;margin-bottom:22px;border:none;background:none;padding:0;
}
.pub-back:hover{color:var(--steel-dark);}

.pub-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.pub-choice-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px 22px;text-align:left;
  cursor:pointer;transition:border-color .16s ease,transform .16s ease;position:relative;
}
.pub-choice-card:hover{border-color:var(--steel);transform:translateY(-2px);}
.pub-choice-num{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--steel);letter-spacing:0.04em;margin-bottom:12px;display:block;}
.pub-choice-card h3{font-family:var(--font-display);font-size:18px;font-weight:700;margin:0 0 7px;}
.pub-choice-card p{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.5;}
.pub-choice-arrow{
  margin-top:16px;width:30px;height:30px;border-radius:50%;background:var(--paper);
  display:flex;align-items:center;justify-content:center;transition:.16s ease;
}
.pub-choice-card:hover .pub-choice-arrow{background:var(--steel);}
.pub-choice-arrow svg{stroke:var(--ink);transition:.16s ease;}
.pub-choice-card:hover .pub-choice-arrow svg{stroke:#fff;}

.pub-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px 26px 8px;}
.pub-panel-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:14px;flex-wrap:wrap;}
.pub-panel-title{font-family:var(--font-display);font-size:19px;font-weight:700;margin:0 0 4px;}
.pub-panel-desc{font-size:13px;color:var(--ink-soft);margin:0;}
.pub-filter-badge{
  background:var(--steel-tint);color:var(--steel-dark);font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
  padding:6px 12px;border-radius:100px;
}
.pub-search-row input{
  width:100%;padding:12px 15px;border-radius:var(--radius);border:1.5px solid var(--line);
  font-size:14.5px;font-family:inherit;outline:none;transition:.15s ease;background:var(--paper);
}
.pub-search-row input:focus{border-color:var(--steel);background:#fff;box-shadow:0 0 0 3px var(--steel-tint);}
.pub-results-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.pub-results-table thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);
  font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line-strong);
}
.pub-results-table tbody td{padding:13px 12px;border-bottom:1px solid var(--line);}
.pub-results-table tbody tr{cursor:pointer;}
.pub-results-table tbody tr:hover{background:var(--paper);}
.pub-empty{padding:44px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}
.pub-empty b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:6px;}
.pub-footnote{padding:14px 4px 22px;font-size:11.5px;color:var(--ink-soft);}
.pub-result-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;
}
.pub-result-card:hover{border-color:var(--steel);}

@media (max-width:640px){
  .pub-choice-grid{grid-template-columns:1fr;}
  .pub-h1{font-size:29px;}
  .pub-topbar{padding:16px 16px;}
  .pub-main{padding:36px 14px 60px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

/* ============================================================
   DEMO DATA
   Ovaj podskup je izvučen direktno iz priloženog fajla
   "ROK - Isporuke.xlsx" (list "Obracun po Zaposlenom", 1.180
   redova / 28 kolona) — 134 stvarna reda, birana da pokriju
   sve statuse roka (prošli rok, danas, skoro, dalje, bez
   datuma) i sve slučajeve sa napomenama/oznakama.

function parseIsoDate(s){
  if(!s) return null;
  const d = new Date(s + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}
function todayDate(){
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function formatSr(iso){
  const d = parseIsoDate(iso);
  if(!d) return null;
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  return `${dd}.${mm}.${d.getFullYear()}.`;
}
function daysBetween(iso){
  const d = parseIsoDate(iso);
  if(!d) return null;
  const t = todayDate();
  return Math.round((d - t) / 86400000);
}
function daniText(n){
  const a = Math.abs(n);
  if(a % 10 === 1 && a % 100 !== 11) return "dan";
  return "dana";
}

/* Da li je promena (npr. pomeranje roka) dovoljno sveža da je vredno
   prikazati kupcu — posle toga se napomena sama povlači (spec: ne
   gomilati stare obaveštenja). */
function isRecentChange(changedAtIso, days){
  if(!changedAtIso) return false;
  const d = new Date(changedAtIso);
  if(isNaN(d.getTime())) return false;
  const diffDays = (new Date() - d) / 86400000;
  return diffDays >= 0 && diffDays <= (days || 14);
}

/* Poslednja skorašnja promena "Datum montaže" za dati nalog (ili null). */
function getRecentDateChange(history, orderId){
  const entries = (history && history[orderId]) || [];
  const dateChanges = entries.filter(h => h.field === "installation_date");
  if(dateChanges.length === 0) return null;
  const last = dateChanges[dateChanges.length - 1];
  return isRecentChange(last.changed_at) ? last : null;
}
function hasRecentDateChange(history, orderId){
  return !!getRecentDateChange(history, orderId);
}

/* STATUS ENGINE — raw data (Datum montaže) -> calculated status.
   Ovo je namerno odvojeno od sirovih podataka (spec §11).
   forDealer: kada je true, tekst koji vidi kupac/diler kaže "isporuka"
   umesto "montaža" — kolona i logika ostaju iste, menja se samo naziv. */
function installationStatus(installation_date, forDealer){
  const word = forDealer ? "isporuke" : "montaže";
  const wordCap = forDealer ? "Isporuka" : "Montaža";
  const wordPlanned = forDealer ? "Planirana isporuka" : "Planirana montaža";
  if(!installation_date){
    return { code:"NO_DATE", label:`Termin ${word} još nije određen.`, badge:"status-nodate", countdown:null };
  }
  const diff = daysBetween(installation_date);
  if(diff < 0){
    return {
      code:"OVERDUE", label:"Rok prošao", badge:"status-overdue",
      countdown:`Rok prošao pre ${Math.abs(diff)} ${daniText(diff)}`, countdownClass:"red"
    };
  }
  if(diff === 0){
    return { code:"TODAY", label:`${wordCap} danas`, badge:"status-today", countdown:"Danas", countdownClass:"amber" };
  }
  return {
    code:"PLANNED", label:wordPlanned, badge:"status-planned",
    countdown:`Za ${diff} ${daniText(diff)}`, countdownClass: diff<=3 ? "amber":"steel"
  };
}

function customerFacingMessage(status, forDealer){
  if(status.code === "OVERDUE"){
    return `Rok ${forDealer ? "isporuke" : "montaže"} je prošao. Javite se svom zastupniku i dogovorite novi termin.`;
  }
  return null;
}

/* ============================================================
   EXCEL IMPORT SERVICE
   Čita XLSX (list "Obracun po Zaposlenom"), validira strukturu,
   mapira kolone, i pravi diff u odnosu na trenutnu bazu.
   Ovo je namerno odvojeno u jasne korake (spec §37).
   ============================================================ */
const ExcelImportService = {

  /* Korak 1+2: čitanje fajla i pronalaženje sheet-a */
  async readWorkbook(file){
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type:"array", cellDates:true });
    let sheetName = wb.SheetNames.includes(SOURCE_SHEET_NAME) ? SOURCE_SHEET_NAME : wb.SheetNames[0];
    const usedFallbackSheet = sheetName !== SOURCE_SHEET_NAME;
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });
    if(rows.length === 0){
      throw new Error("Fajl je prazan ili nije moguće pročitati podatke.");
    }
    const header = rows[0].map(h => (h == null ? "" : String(h).trim()));
    const dataRows = rows.slice(1);
    return { sheetName, usedFallbackSheet, header, dataRows, totalRows: dataRows.length };
  },

  /* Isto što i readWorkbook, samo iz CSV teksta (koristi se za živo
     povlačenje iz Google Sheets-a — objavljeni CSV export nema
     "listove", pa je usedFallbackSheet uvek false). */
  readFromCsvText(csvText){
    const wb = XLSX.read(csvText, { type:"string", cellDates:false, raw:true });
    const sheetName = wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });
    if(rows.length === 0){
      throw new Error("Google Sheet je prazan ili nije moguće pročitati podatke.");
    }
    const header = rows[0].map(h => (h == null ? "" : String(h).trim()));
    const dataRows = rows.slice(1);
    return { header, dataRows, totalRows: dataRows.length };
  },

  /* Korak 3+4: validacija strukture */
  validateStructure(header){
    const missingRequired = REQUIRED_COLUMNS.filter(c => !header.includes(c));
    const missingOptional = SOURCE_COLUMNS.filter(c => !REQUIRED_COLUMNS.includes(c) && !header.includes(c));
    return {
      ok: missingRequired.length === 0,
      missingRequired, missingOptional,
      unknownColumns: header.filter(h => h && !SOURCE_COLUMNS.includes(h))
    };
  },

  /* Pretvara Excel serial / Date / string u ISO (YYYY-MM-DD) ili null */
  toIsoDate(v){
    if(v == null || v === "") return null;
    if(v instanceof Date && !isNaN(v.getTime())){
      const y = v.getFullYear(), m = String(v.getMonth()+1).padStart(2,"0"), d = String(v.getDate()).padStart(2,"0");
      return `${y}-${m}-${d}`;
    }
    if(typeof v === "number"){
      const d = XLSX.SSF.parse_date_code(v);
      if(!d) return "INVALID";
      return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`;
    }
    if(typeof v === "string"){
      const t = v.trim();
      if(t === "") return null;
      const m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m) return `${m[1]}-${m[2]}-${m[3]}`;
      const m2 = t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})\.?$/);
      if(m2) return `${m2[3]}-${String(m2[2]).padStart(2,"0")}-${String(m2[1]).padStart(2,"0")}`;
      return "INVALID";
    }
    return "INVALID";
  },

  /* Korak 5-8: mapiranje jednog reda + provera grešaka po redu */
  mapRow(header, rawArr, rowNumber){
    const raw = {};
    header.forEach((colName, i) => { if(colName) raw[colName] = rawArr[i] === undefined ? null : rawArr[i]; });

    const errors = [];
    const order_id = raw["Broj dokumenta"] ? String(raw["Broj dokumenta"]).trim() : "";
    if(!order_id){
      errors.push("„Broj dokumenta“ nedostaje");
    }

    const mapped = { raw_row: rowNumber, raw_data: raw };
    Object.entries(COLUMN_MAP).forEach(([src, field]) => {
      let v = raw.hasOwnProperty(src) ? raw[src] : null;
      if(field.endsWith("_date") || field === "installation_date" || field === "measurement_date"){
        const iso = ExcelImportService.toIsoDate(v);
        if(iso === "INVALID"){
          errors.push(`Nevalidan datum u koloni „${src}“`);
          v = null;
        } else v = iso;
      } else if(typeof v === "string"){
        v = v.trim() === "" ? null : v.trim();
      }
      mapped[field] = v === undefined ? null : v;
    });
    mapped.order_id = order_id || null;
    if(!mapped.order_date && errors.every(e => !e.includes("Datum dokument"))){
      // datum dokumenta prazan nije fatalna greška, samo se evidentira
    }
    return { mapped, errors, rowNumber };
  },

  /* Korak 9-11: diff u odnosu na trenutnu bazu */
  buildPreview(header, dataRows, currentOrders){
    const seenIds = new Map();
    const errorRows = [];
    const validMapped = [];

    dataRows.forEach((arr, idx) => {
      const rowNumber = idx + 2; // +2: 1-based + header row
      const isBlankRow = arr.every(c => c === null || c === "" || c === undefined);
      if(isBlankRow) return;
      const { mapped, errors } = ExcelImportService.mapRow(header, arr, rowNumber);
      if(mapped.order_id){
        if(seenIds.has(mapped.order_id)){
          errorRows.push({ rowNumber, order_id: mapped.order_id, reason:`Dupliran ORDER_ID (već se pojavljuje u redu ${seenIds.get(mapped.order_id)})` });
          return;
        }
        seenIds.set(mapped.order_id, rowNumber);
      }
      if(errors.length){
        errorRows.push({ rowNumber, order_id: mapped.order_id || "(nepoznato)", reason: errors.join("; ") });
        return;
      }
      validMapped.push(mapped);
    });

    const newRows = [], changedRows = [], unchangedRows = [];
    const TRACK_FIELDS = ["installation_date","measurement_date","installer","sales_representative","business_area","order_label"];

    validMapped.forEach(m => {
      const existing = currentOrders[m.order_id];
      if(!existing){
        newRows.push(m);
      } else {
        const diffs = TRACK_FIELDS
          .filter(f => (existing[f] || null) !== (m[f] || null))
          .map(f => ({ field:f, old: existing[f] || null, new: m[f] || null }));
        if(diffs.length) changedRows.push({ mapped:m, diffs });
        else unchangedRows.push(m);
      }
    });

    const newFileIds = new Set(validMapped.map(m => m.order_id));
    const missingIds = Object.keys(currentOrders).filter(id => !newFileIds.has(id) && !currentOrders[id].not_present_in_last_import);

    return {
      totalRows: dataRows.length,
      newRows, changedRows, unchangedRows, errorRows, missingIds,
      validCount: validMapped.length
    };
  }
};

const EMAIL_SUBJECT = "Sunce Marinković: promena roka isporuke";

const NotificationService = {
  /* Vraća listu notifikacija koje treba poslati za promenu roka na
     jednom nalogu: uvek email (ako kupac ima email), plus SMS/Viber
     prema izboru kupca. Zapisi su spremni za slanje — dugme "Pošalji"
     ih stvarno šalje preko Netlify funkcija. */
  buildForDeadlineChange({ customer, orderId, oldDate, newDate, importId }){
    if(!customer) return [];
    const message = buildDeadlineChangeMessage(customer, orderId, oldDate, newDate);
    const hasPhone = !!(customer.phone && customer.phone.trim());
    const hasEmail = !!(customer.email && customer.email.trim());
    const entries = [];

    if(customer.notify_email !== false){
      entries.push({
        id: "N-" + Math.random().toString(36).slice(2,9), created_at: isoNow(),
        customer_id: customer.id, customer_name: customer.name,
        email: customer.email || null, order_id: orderId, channel: "email",
        subject: EMAIL_SUBJECT, message, import_id: importId,
        status: hasEmail ? "SPREMNO ZA SLANJE" : "NEDOSTAJE EMAIL", sent: false
      });
    }

    const channelPref = customer.notify_channel || "sms";
    if(channelPref !== "nijedan"){
      const channels = channelPref === "oba" ? ["sms","viber"] : [channelPref];
      channels.forEach(ch => entries.push({
        id: "N-" + Math.random().toString(36).slice(2,9), created_at: isoNow(),
        customer_id: customer.id, customer_name: customer.name,
        phone: customer.phone || null, order_id: orderId, channel: ch,
        message, import_id: importId,
        status: hasPhone ? "SPREMNO ZA SLANJE" : "NEDOSTAJE BROJ TELEFONA", sent: false
      }));
    }
    return entries;
  }
};

/* Stvarno slanje jedne notifikacije preko Netlify funkcije.
   Vraća { ok:true, messageId } ili { ok:false, error }. */
async function sendNotification(n){
  try{
    if(n.channel === "email"){
      if(!n.email) return { ok:false, error:"Nedostaje email adresa." };
      const res = await fetch("/.netlify/functions/send-email", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ to:n.email, subject:n.subject || EMAIL_SUBJECT, text:n.message })
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok || !data.ok) return { ok:false, error: data.error || `Slanje nije uspelo (HTTP ${res.status}).` };
      return { ok:true, messageId: data.messageId };
    }
    // sms / viber — ista Netlify SMS funkcija; Viber se dodaje kasnije kad šablon bude odobren
    if(!n.phone) return { ok:false, error:"Nedostaje broj telefona." };
    const res = await fetch("/.netlify/functions/send-sms", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ to:n.phone, text:n.message })
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.ok) return { ok:false, error: data.error || `Slanje nije uspelo (HTTP ${res.status}).` };
    return { ok:true, messageId: data.messageId };
  }catch(err){
    return { ok:false, error: err.message || "Greška pri povezivanju sa servisom za slanje." };
  }
}



/* ============================================================
   DEMO "NOVI IZVOZ" GENERATOR
   Simulira sledeći dnevni XLSX izvoz iz internog softvera —
   koristi se kad admin klikne "Simuliraj novi izvoz" u Import
   centru, bez potrebe za stvarnim upload-om fajla. Gradi header
   + data-rows u TAČNO istom obliku kao XLSX.utils.sheet_to_json
   sa header:1, da bi prošao kroz identičan ExcelImportService.
   ============================================================ */
function buildDemoExportArrays(currentOrders){
  const header = SOURCE_COLUMNS.slice();
  const ids = Object.keys(currentOrders).sort();
  const rowFor = (o) => header.map(col => {
    const field = COLUMN_MAP[col];
    if(col === "Broj dokumenta") return o.order_id;
    if(field == null) return null;
    let v = o[field];
    if(v == null) return null;
    if(field.includes("date")) return v; // ISO string, service parses it fine
    return v;
  });

  const rows = ids.map(id => rowFor(currentOrders[id]));

  // 1) Pomeri rok montaže za 5 naloga (+2 dana), jedan postavi na "danas"
  const shiftTargets = ids.slice(0, 5);
  shiftTargets.forEach((id, i) => {
    const rowIdx = ids.indexOf(id);
    const o = currentOrders[id];
    const dateColIdx = header.indexOf("Datum montaže");
    if(i === 0){
      rows[rowIdx][dateColIdx] = new Date().toISOString().slice(0,10);
    } else if(o.installation_date){
      const d = parseIsoDate(o.installation_date);
      d.setDate(d.getDate() + 2);
      rows[rowIdx][dateColIdx] = d.toISOString().slice(0,10);
    } else {
      const d = todayDate(); d.setDate(d.getDate() + 5);
      rows[rowIdx][dateColIdx] = d.toISOString().slice(0,10);
    }
  });

  // 2) Ukloni jedan nalog iz "novog izvoza" (simulira NOT PRESENT IN LAST IMPORT)
  const droppedId = ids[ids.length - 1];
  const keepRows = rows.filter((r, i) => ids[i] !== droppedId);
  const keepIds = ids.filter(id => id !== droppedId);

  // 3) Dodaj dva potpuno nova naloga
  const stamp = Date.now().toString().slice(-4);
  const newOrder1 = header.map(col => {
    if(col === "Ime") return "Novi";
    if(col === "Prezime") return "Kupac " + stamp;
    if(col === "Broj dokumenta") return "N6X" + stamp + "1";
    if(col === "Datum dokument") return new Date().toISOString().slice(0,10);
    if(col === "Datum montaže") { const d = todayDate(); d.setDate(d.getDate()+14); return d.toISOString().slice(0,10); }
    if(col === "Broj_PVC") return 3;
    if(col === "Zastupnik") return "";
    if(col === "Područja_Poslovanja") return "Kragujevac";
    return null;
  });
  const newOrder2 = header.map(col => {
    if(col === "Ime") return "Test";
    if(col === "Prezime") return "Nalog " + stamp;
    if(col === "Broj dokumenta") return "N6X" + stamp + "2";
    if(col === "Datum dokument") return new Date().toISOString().slice(0,10);
    if(col === "Datum montaže") return null;
    if(col === "Broj_AL") return 2;
    if(col === "Područja_Poslovanja") return "Beograd";
    return null;
  });

  // 4) Ubaci red sa greškom: prazan "Broj dokumenta"
  const errorRow = header.map(col => {
    if(col === "Ime") return "Nepoznat";
    if(col === "Prezime") return "Red";
    if(col === "Datum dokument") return new Date().toISOString().slice(0,10);
    return null;
  });

  // 5) Ubaci duplikat prvog reda (isti Broj dokumenta dvaput)
  const dupRow = keepRows[0] ? keepRows[0].slice() : null;

  const finalRows = keepRows.concat([newOrder1, newOrder2, errorRow]).concat(dupRow ? [dupRow] : []);

  return { header, rows: finalRows, meta: { shiftTargets, droppedId, newIds:["N6X"+stamp+"1","N6X"+stamp+"2"] } };
}

function SunMark({ size, style }){
  const s = size || 26;
  return <img src={SUN_LOGO_SRC} width={s} height={s} alt="Sunce Marinković" style={{display:"block",objectFit:"contain",...style}} />;
}

function StatusBadge({ status }){
  return (
    <span className={`badge ${status.badge}`}>
      <span className="dot"></span>{status.label}
    </span>
  );
}

function ImportBadge({ kind }){
  const map = {
    new:{cls:"status-new", label:"Novi"},
    changed:{cls:"status-changed", label:"Izmenjen"},
    unchanged:{cls:"status-unchanged", label:"Bez promene"},
    missing:{cls:"status-missing", label:"Nedostaje"},
    error:{cls:"status-error", label:"Greška"},
    success:{cls:"status-success", label:"Uspešno"},
  };
  const m = map[kind] || map.unchanged;
  return <span className={`badge ${m.cls}`}><span className="dot"></span>{m.label}</span>;
}

function Modal({ title, onClose, children, wide }){
  return (
    <div className="modal-overlay" onClick={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal" style={wide ? {maxWidth:960} : {}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <h3 style={{fontSize:17}}>{title}</h3>
          <button className="btn ghost" onClick={onClose}>Zatvori ✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function EmptyState({ title, sub }){
  return (
    <div className="empty-state">
      <h3>{title}</h3>
      {sub && <div className="small">{sub}</div>}
    </div>
  );
}

function ProductSummary({ order, compact }){
  const items = PRODUCT_FIELDS.map(p => ({label:p.label, qty:order[p.key]})).filter(p => p.qty && Number(p.qty)>0);
  if(items.length === 0) return <span className="muted small">Nema unetih količina.</span>;
  return (
    <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
      {items.map(it => (
        <span key={it.label} className="tag-pill" style={{fontFamily:"inherit"}}>
          {it.label}: <b>{it.qty}</b>
        </span>
      ))}
    </div>
  );
}

/* ============================================================
   KUPAC — DASHBOARD
   ============================================================ */
function CustomerDashboard({ customer, myOrders, setView, history }){
  const active = myOrders; // u MVP-u svi dodeljeni nalozi se smatraju aktivnim
  const withDate = active.filter(o => o.installation_date);
  const upcoming = withDate
    .map(o => ({ o, diff: daysBetween(o.installation_date) }))
    .filter(x => x.diff >= 0)
    .sort((a,b) => a.diff - b.diff)[0];
  const overdueCount = active.filter(o => installationStatus(o.installation_date, true).code === "OVERDUE").length;

  return (
    <div>
      <div className="callout">Dobar dan, <b>{customer.name}</b>. Ovo je pregled Vaših aktivnih naloga.</div>

      <div className="stat-row">
        <div className="stat">
          <div className="label">Aktivni nalozi</div>
          <div className="value steel">{active.length}</div>
        </div>
        <div className="stat">
          <div className="label">Najbliži rok</div>
          <div className="value" style={{fontSize:18}}>
            {upcoming ? formatSr(upcoming.o.installation_date) : "—"}
          </div>
          {upcoming && <div className="small muted">{installationStatus(upcoming.o.installation_date, true).countdown}</div>}
        </div>
        <div className="stat">
          <div className="label">Rok prošao</div>
          <div className={`value ${overdueCount>0?"amber":"green"}`}>{overdueCount}</div>
        </div>
        <div className="stat">
          <div className="label">Bez termina</div>
          <div className="value">{active.filter(o=>!o.installation_date).length}</div>
        </div>
      </div>

      <div className="section-title"><h2>Vaši nalozi</h2><div className="rule"></div>
        <button className="btn secondary small" onClick={()=>setView({view:"orders"})}>Sve →</button>
      </div>

      {active.length === 0
        ? <EmptyState title="Nema aktivnih naloga." sub="Kada Vam dodelimo novi nalog, pojaviće se ovde." />
        : active.slice(0,5).map(o => <CustomerOrderCard key={o.order_id} order={o} changed={hasRecentDateChange(history, o.order_id)} onClick={()=>setView({view:"order-detail", orderId:o.order_id})} />)
      }
    </div>
  );
}

function CustomerOrderCard({ order, onClick, changed }){
  const st = installationStatus(order.installation_date, true);
  return (
    <div className="order-card bracket" onClick={onClick}>
      <div className="top">
        <div>
          <div className="oid mono">{order.order_id}</div>
          <div className="meta">Nalog od {formatSr(order.order_date) || "—"}</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
          <StatusBadge status={st} />
          {changed && <span className="xsmall" style={{color:"var(--amber)"}}>Termin ažuriran</span>}
        </div>
      </div>
      <ProductSummary order={order} />
      <div className="bottom">
        <div>
          <div className="xsmall muted">Planirana isporuka</div>
          <div style={{fontWeight:600}}>{formatSr(order.installation_date) || "Nije određeno"}</div>
        </div>
        {st.countdown && <div className={`countdown ${st.countdownClass}`}>{st.countdown}</div>}
      </div>
    </div>
  );
}

/* ============================================================
   KUPAC — LISTA NALOGA (pretraga / filter)
   ============================================================ */
function CustomerOrderList({ myOrders, setView, history }){
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("svi");

  const filtered = myOrders.filter(o => {
    const st = installationStatus(o.installation_date, true).code;
    if(filter === "u-roku" && (st==="OVERDUE")) return false;
    if(filter === "prosao-rok" && st!=="OVERDUE") return false;
    if(filter === "bez-termina" && st!=="NO_DATE") return false;
    if(q && !o.order_id.toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  });

  return (
    <div>
      <div className="filters-bar">
        <div className="field">
          <label>Pretraga po broju naloga</label>
          <input type="text" placeholder="npr. N6V32971" value={q} onChange={e=>setQ(e.target.value)} />
        </div>
        <div className="field">
          <label>Filter</label>
          <select value={filter} onChange={e=>setFilter(e.target.value)}>
            <option value="svi">Svi</option>
            <option value="u-roku">Aktivni (u roku)</option>
            <option value="prosao-rok">Rok prošao</option>
            <option value="bez-termina">Bez termina</option>
          </select>
        </div>
      </div>
      {filtered.length === 0
        ? <EmptyState title="Nema naloga koji odgovaraju pretrazi." />
        : filtered.map(o => <CustomerOrderCard key={o.order_id} order={o} changed={hasRecentDateChange(history, o.order_id)} onClick={()=>setView({view:"order-detail", orderId:o.order_id})} />)
      }
    </div>
  );
}

/* ============================================================
   KUPAC — DETALJI NALOGA
   ============================================================ */
function CustomerOrderDetail({ order, setView, recentDateChange, forDealer }){
  if(!order) return <EmptyState title="Nalog nije pronađen ili nemate pristup ovom nalogu." />;
  const word = forDealer ? "isporuke" : "montaže";
  const wordCap = forDealer ? "Isporuka" : "Montaža";
  const st = installationStatus(order.installation_date, forDealer);
  const msg = customerFacingMessage(st, forDealer);
  const cv = toCustomerView(order);

  let shiftNote = null;
  if(recentDateChange){
    const oldD = recentDateChange.old, newD = recentDateChange.new;
    if(oldD && newD){
      const pushedLater = newD > oldD;
      shiftNote = pushedLater
        ? `Rok ${word} je pomeren na kasniji datum: ${formatSr(newD)} (umesto ${formatSr(oldD)}).`
        : `Dobra vest, rok ${word} je pomeren na raniji datum: ${formatSr(newD)} (umesto ${formatSr(oldD)}).`;
    } else if(!oldD && newD){
      shiftNote = `Rok ${word} je određen: ${formatSr(newD)}.`;
    }
  }

  const steps = [
    { key:"received", label:"Nalog primljen", done:true },
    { key:"measured", label:"Merenje obavljeno", done: !!order.measurement_date },

          <div className="kv"><span className="k">Datum merenja</span><span className="v">{formatSr(cv.measurement_date) || "Nije zakazano"}</span></div>
          <div className="kv"><span className="k">Planirana isporuka</span><span className="v">{formatSr(cv.installation_date) || "Nije određeno"}</span></div>
          {st.countdown && <div className="kv"><span className="k">Preostalo</span><span className={`v countdown ${st.countdownClass}`}>{st.countdown}</span></div>}
        </div>
        <div className="card" style={{padding:20}}>
          <h3 style={{fontSize:14,textTransform:"uppercase",letterSpacing:"0.05em",color:"var(--steel)",marginBottom:12}}>Proizvodi</h3>

      <div className="section-title"><h2>Tok realizacije</h2><div className="rule"></div></div>

        <ul className="timeline">
          {steps.map(s => (
            <li key={s.key}>
              <span className="tdot" style={{background: s.done ? "var(--green)" : "var(--line-strong)"}}></span>
              <span style={{color: s.done ? "var(--ink)" : "var(--ink-soft)"}}>{s.label}</span>
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}


/* ============================================================
   ADMIN — DASHBOARD
   ============================================================ */
function AdminDashboard({ orders, importLog, history, setView }){
  const list = Object.values(orders);
  const withPlanned = list.filter(o => o.installation_date);
  const next7 = withPlanned.filter(o => { const d = daysBetween(o.installation_date); return d >= 0 && d <= 7; });
  const overdue = withPlanned.filter(o => daysBetween(o.installation_date) < 0);
  const noDate = list.filter(o => !o.installation_date);
  const lastImport = importLog[0];
  const notPresent = list.filter(o => o.not_present_in_last_import);

  const dateShifts = Object.values(history || {}).flat().filter(h => h.field === "installation_date" && h.old && h.new);
  const avgShiftDays = dateShifts.length
    ? Math.round(dateShifts.reduce((sum,h) => sum + (parseIsoDate(h.new) - parseIsoDate(h.old))/86400000, 0) / dateShifts.length)
    : null;
  const pushedLaterCount = dateShifts.filter(h => h.new > h.old).length;
  const pushedEarlierCount = dateShifts.filter(h => h.new < h.old).length;

  return (
    <div>
      <div className="stat-row">
        <div className="stat"><div className="label">Ukupno naloga</div><div className="value steel">{list.length}</div></div>
        <div className="stat"><div className="label">Sa planiranom montažom</div><div className="value">{withPlanned.length}</div></div>
        <div className="stat"><div className="label">Montaža u narednih 7 dana</div><div className="value amber">{next7.length}</div></div>
        <div className="stat"><div className="label">Rok prošao</div><div className="value" style={{color:"var(--red)"}}>{overdue.length}</div></div>
      </div>
      <div className="stat-row">
        <div className="stat"><div className="label">Bez termina montaže</div><div className="value">{noDate.length}</div></div>
        <div className="stat"><div className="label">Nema u poslednjem izvozu</div><div className="value">{notPresent.length}</div></div>
        <div className="stat">
          <div className="label">Poslednji uvoz</div>
          <div className="value" style={{fontSize:16}}>{lastImport ? formatSr(lastImport.date.slice(0,10)) : "—"}</div>
          {lastImport && <ImportBadge kind={lastImport.status==="SUCCESS"?"success":"error"} />}
        </div>
        <div className="stat"><div className="label">Redova u poslednjem uvozu</div><div className="value">{lastImport ? lastImport.rows_total : "—"}</div></div>
      </div>

      <div className="stat-row" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
        <div className="stat">
          <div className="label">Prosečno pomeranje roka</div>
          <div className="value" style={{fontSize:20}}>{avgShiftDays===null ? "—" : `${avgShiftDays>0?"+":""}${avgShiftDays} ${daniText(avgShiftDays)}`}</div>
          <div className="xsmall muted" style={{marginTop:4}}>na osnovu {dateShifts.length} zabeleženih promena datuma montaže</div>
        </div>
        <div className="stat"><div className="label">Rok pomeren na kasnije</div><div className="value amber">{pushedLaterCount}</div></div>
        <div className="stat"><div className="label">Rok pomeren na ranije</div><div className="value green">{pushedEarlierCount}</div></div>
      </div>

      <div className="section-title"><h2>Rokovi koji dolaze</h2><div className="rule"></div></div>
      <div className="table-wrap">
        <table>
          <thead><tr><th>Broj naloga</th><th>Kupac (Ime Prezime)</th><th>Datum montaže</th><th>Status</th><th>Područje</th></tr></thead>
          <tbody>
            {next7.sort((a,b)=>daysBetween(a.installation_date)-daysBetween(b.installation_date)).slice(0,10).map(o => (
              <tr key={o.order_id} style={{cursor:"pointer"}} onClick={()=>setView({view:"order-detail", orderId:o.order_id})}>
                <td className="mono">{o.order_id}</td>
                <td>{fullName(o)}</td>
                <td>{formatSr(o.installation_date)}</td>
                <td><StatusBadge status={installationStatus(o.installation_date)} /></td>
                <td className="muted">{o.business_area || "—"}</td>
              </tr>
            ))}
            {next7.length===0 && <tr><td colSpan={5} className="muted" style={{textAlign:"center",padding:20}}>Nema naloga sa montažom u narednih 7 dana.</td></tr>}
          </tbody>
        </table>
      </div>

      {overdue.length > 0 && (
        <>
          <div className="section-title"><h2>Rok prekoračen</h2><div className="rule"></div></div>
          <div className="table-wrap">
            <table>
              <thead><tr><th>Broj naloga</th><th>Kupac</th><th>Trebalo je</th><th>Kašnjenje</th><th>Montažer</th></tr></thead>
              <tbody>
                {overdue.sort((a,b)=>daysBetween(a.installation_date)-daysBetween(b.installation_date)).slice(0,10).map(o=>(
                  <tr key={o.order_id} style={{cursor:"pointer"}} onClick={()=>setView({view:"order-detail", orderId:o.order_id})}>
                    <td className="mono">{o.order_id}</td>
                    <td>{fullName(o)}</td>
                    <td>{formatSr(o.installation_date)}</td>
                    <td style={{color:"var(--red)",fontWeight:600}}>{installationStatus(o.installation_date).countdown}</td>
                    <td className="muted">{o.installer || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}
    </div>
  );
}

/* ============================================================
   ADMIN — SVI NALOZI (tabela + filteri)
   ============================================================ */
function AdminOrders({ orders, setView }){
  const list = Object.values(orders);
  const [q, setQ] = useState("");
  const [statusF, setStatusF] = useState("svi");
  const [areaF, setAreaF] = useState("sva");
  const [installerF, setInstallerF] = useState("svi");
  const [pageSize, setPageSize] = useState(100);

  const areas = [...new Set(list.map(o=>o.business_area).filter(Boolean))].sort();
  const installers = [...new Set(list.map(o=>o.installer).filter(Boolean))].sort();

  const filtered = list.filter(o => {
    if(q){
      const s = q.toLowerCase();
      if(!(o.order_id.toLowerCase().includes(s) || fullName(o).toLowerCase().includes(s))) return false;
    }
    if(statusF !== "svi" && installationStatus(o.installation_date).code !== statusF) return false;
    if(areaF !== "sva" && o.business_area !== areaF) return false;
    if(installerF !== "svi" && o.installer !== installerF) return false;
    return true;
  }).sort((a,b) => (a.installation_date||"9999").localeCompare(b.installation_date||"9999"));

  const shown = filtered.slice(0, pageSize);

  return (
    <div>
      <div className="filters-bar">
        <div className="field"><label>Pretraga</label><input type="text" placeholder="Broj naloga ili ime" value={q} onChange={e=>{setQ(e.target.value); setPageSize(100);}} /></div>
        <div className="field"><label>Status roka</label>
          <select value={statusF} onChange={e=>setStatusF(e.target.value)}>
            <option value="svi">Svi</option>
            <option value="OVERDUE">Rok prošao</option>
            <option value="TODAY">Danas</option>
            <option value="PLANNED">Planirano</option>
            <option value="NO_DATE">Bez termina</option>
          </select>
        </div>
        <div className="field"><label>Područje</label>
          <select value={areaF} onChange={e=>setAreaF(e.target.value)}>
            <option value="sva">Sva</option>
            {areas.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
        </div>
        <div className="field"><label>Montažer</label>
          <select value={installerF} onChange={e=>setInstallerF(e.target.value)}>
            <option value="svi">Svi</option>
            {installers.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
        </div>
      </div>

      <div className="small muted" style={{marginBottom:8}}>Prikazano {shown.length} od {filtered.length} (ukupno {list.length} naloga)</div>

      <div className="table-wrap desktop-only">
        <table>
          <thead><tr>
            <th>Broj dok.</th><th>Ime i prezime</th><th>Datum dok.</th><th>Zastupnik</th><th>Montažer</th>
            <th>Datum montaže</th><th>Status</th><th>Područje</th><th>Oznaka</th>
          </tr></thead>
          <tbody>
            {shown.map(o => (
              <tr key={o.order_id} style={{cursor:"pointer"}} onClick={()=>setView({view:"order-detail", orderId:o.order_id})}>
                <td className="mono">{o.order_id}{o.not_present_in_last_import && <span title="Nema u poslednjem uvozu" style={{color:"var(--amber)"}}> ●</span>}</td>
                <td>{fullName(o)}</td>
                <td className="mono">{formatSr(o.order_date)}</td>
                <td className="muted">{o.sales_representative || "—"}</td>
                <td className="muted">{o.installer || "—"}</td>
                <td className="mono">{formatSr(o.installation_date) || "—"}</td>
                <td><StatusBadge status={installationStatus(o.installation_date)} /></td>
                <td className="muted">{o.business_area || "—"}</td>
                <td className="muted small">{o.order_label || ""}</td>
              </tr>
            ))}
            {filtered.length===0 && <tr><td colSpan={9}><EmptyState title="Nema naloga koji odgovaraju pretrazi." /></td></tr>}
          </tbody>
        </table>
      </div>

      <div className="mobile-cards">
        {filtered.length===0 && <EmptyState title="Nema naloga koji odgovaraju pretrazi." />}
        {shown.map(o => <CustomerOrderCard key={o.order_id} order={o} onClick={()=>setView({view:"order-detail", orderId:o.order_id})} />)}
      </div>

      {filtered.length > shown.length && (
        <div style={{textAlign:"center",marginTop:16}}>
          <button className="btn secondary" onClick={()=>setPageSize(n=>n+100)}>Prikaži još ({filtered.length - shown.length} preostalo)</button>
        </div>
      )}
    </div>
  );
}

function CustomerManagement({ customers, orders, addCustomer, assignOrder, unassignOrder, updateCustomerContact }){
  const [showNew, setShowNew] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name:"", email:"", phone:"" });
  const [orderQuery, setOrderQuery] = useState("");
  const [custQuery, setCustQuery] = useState("");
  const [contactForm, setContactForm] = useState(null);

  const allOrderIds = Object.keys(orders).sort();
  const assignedElsewhere = (id) => customers.find(c => c.order_ids.includes(id));
  const missingContactCount = customers.filter(c => !c.email).length;

  const submitNew = () => {
    if(!form.name.trim()) return;
    addCustomer(form);
    setForm({ name:"", email:"", phone:"" });
    setShowNew(false);
  };

  const visibleCustomers = custQuery
    ? customers.filter(c => c.name.toLowerCase().includes(custQuery.toLowerCase()) || c.id.toLowerCase().includes(custQuery.toLowerCase()))
    : customers;

  const openEdit = (c) => { setEditing(c.id); setContactForm({ name:c.name, email:c.email||"", phone:c.phone||"", notify_channel: c.notify_channel || "sms", notify_email: c.notify_email !== false }); };
  const saveContact = () => { updateCustomerContact(editing, contactForm); };

  return (
    <div>
      {missingContactCount > 0 && (
        <div className="note-block">
          {missingContactCount} od {customers.length} kupaca nema unet email. Dopunite kontakt preko dugmeta „Uredi”.

      )}
      <div className="filters-bar" style={{justifyContent:"space-between"}}>
        <div className="field"><label>Pretraga kupaca</label><input type="text" placeholder="Naziv ili Customer ID…" value={custQuery} onChange={e=>setCustQuery(e.target.value)} /></div>
        <button className="btn" onClick={()=>setShowNew(true)}>+ Novi kupac</button>
      </div>

      <div className="small muted" style={{marginBottom:8}}>{visibleCustomers.length} od {customers.length} kupaca</div>

      <div className="table-wrap">
        <table>
          <thead><tr><th>Naziv</th><th>Customer ID</th><th>Email</th><th>Telefon</th><th>Obaveštenje</th><th>Dodeljeni nalozi</th><th></th></tr></thead>
          <tbody>
            {visibleCustomers.slice(0,80).map(c => (
              <tr key={c.id}>

      </div>

/* ============================================================
   ADMIN — IMPORT CENTER
   ============================================================ */
function ImportCenter({ orders, importLog, runImport }){
  const [session, setSession] = useState({ status:"idle" });
  const fileRef = useRef(null);
  const lastImport = importLog[0];

  const processHeaderAndRows = (header, dataRows, sourceLabel) => {
    const structureCheck = ExcelImportService.validateStructure(header);
    if(!structureCheck.ok){
      setSession({ status:"structure-error", structureCheck, sourceLabel });
      return;
    }
    const preview = ExcelImportService.buildPreview(header, dataRows, orders);
    setSession({ status:"preview", header, dataRows, structureCheck, preview, sourceLabel });
  };

  const onFile = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setSession({ status:"reading" });
    try{
      const { sheetName, usedFallbackSheet, header, dataRows } = await ExcelImportService.readWorkbook(file);
      processHeaderAndRows(header, dataRows, `${file.name}${usedFallbackSheet ? ` (koristi se list „${sheetName}“, „${SOURCE_SHEET_NAME}“ nije pronađen)`:""}`);
    }catch(err){
      setSession({ status:"fatal-error", message: err.message || "Nepoznata greška pri čitanju fajla." });
    }
    if(fileRef.current) fileRef.current.value = "";
  };

  const onDemoExport = () => {
    setSession({ status:"reading" });
    setTimeout(() => {
      const { header, rows } = buildDemoExportArrays(orders);
      processHeaderAndRows(header, rows, "Simulirani novi izvoz (demo)");
    }, 350);
  };

  const onSyncFromSheet = async () => {
    setSession({ status:"reading" });
    try{
      const res = await fetch(LIVE_SHEET_CSV_URL, { cache:"no-store" });
      if(!res.ok) throw new Error(`Google Sheet nije dostupan (HTTP ${res.status}).`);
      const csvText = await res.text();
      const { header, dataRows } = ExcelImportService.readFromCsvText(csvText);
      processHeaderAndRows(header, dataRows, "Google Sheets — Rokovi (P&G dileri)");
    }catch(err){
      setSession({ status:"fatal-error", message: (err.message || "Nepoznata greška pri povezivanju sa Google Sheets-om.") + " Proverite da li je Sheet i dalje deljen kao „Anyone with the link — Viewer“." });
    }
  };

  const confirmImport = () => {
    runImport(session.preview, session.sourceLabel);
    setSession({ status:"idle" });
  };

  return (
    <div>
      <div className="callout">
        Portal može da učita nalog direktno sa žive tabele (Google Sheets), ili ručno preko fajla.
      </div>

      <div className="grid-2" style={{marginBottom:22}}>
        <div className="stat"><div className="label">Poslednji uvoz</div><div className="value" style={{fontSize:17}}>{lastImport ? `${formatSr(lastImport.date.slice(0,10))} ${lastImport.date.slice(11,16)}` : "—"}</div></div>
        <div className="stat"><div className="label">Broj redova / status</div><div className="value" style={{fontSize:17}}>{lastImport ? `${lastImport.rows_total} redova` : "—"} {lastImport && <ImportBadge kind={lastImport.status==="SUCCESS"?"success":"error"} />}</div></div>
      </div>

      {session.status === "idle" && (
        <div className="card" style={{padding:26,textAlign:"center"}}>
          <h3 style={{marginBottom:6}}>Učitaj novi izvoz</h3>
          <p className="muted small" style={{marginBottom:18}}>Podržan format: .xlsx, list „{SOURCE_SHEET_NAME}“, header u prvom redu.</p>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button className="btn" onClick={onSyncFromSheet}>Osveži sa Google Sheets-a</button>
            <button className="btn secondary" onClick={()=>fileRef.current.click()}>Učitaj XLSX fajl</button>
            <button className="btn secondary" onClick={onDemoExport}>Simuliraj novi izvoz (demo)</button>
          </div>
          <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={onFile} />
          <div className="hint" style={{marginTop:14}}>„Osveži sa Google Sheets-a“ učitava trenutno stanje tabele „Rokovi (P&G dileri)“ uživo. „Simuliraj novi izvoz“ pravi probni sledeći izvoz za testiranje bez pravog fajla.</div>
        </div>
      )}

      {session.status === "reading" && (
        <div className="card" style={{padding:26,textAlign:"center"}}>
          <div className="step-list">
            <div className="step active">1. Čitanje fajla</div>
            <div className="step">2. Validacija</div>
            <div className="step">3. Analiza promena</div>
            <div className="step">4. Pregled</div>
            <div className="step">5. Uvoz</div>
          </div>
          <p className="muted">Obrada u toku…</p>
        </div>
      )}

      {session.status === "fatal-error" && (
        <div className="card" style={{padding:22}}>
          <div className="note-block" style={{background:"var(--red-tint)",borderColor:"#E2B3A8",color:"var(--red)"}}>Greška: {session.message}</div>
          <button className="btn secondary" onClick={()=>setSession({status:"idle"})}>Pokušaj ponovo</button>
        </div>
      )}

      {session.status === "structure-error" && (
        <div className="card" style={{padding:22}}>
          <div className="step-list">
            <div className="step done">1. Čitanje fajla</div>
            <div className="step active">2. Validacija strukture</div>

          <button className="btn secondary" onClick={()=>setSession({status:"idle"})}>Nazad</button>
        </div>
      )}

      {session.status === "preview" && (
        <div className="card" style={{padding:22}}>
          <div className="step-list">
            <div className="step done">1. Čitanje</div><div className="step done">2. Validacija</div><div className="step done">3. Analiza promena</div>
            <div className="step active">4. Pregled</div><div className="step">5. Uvoz</div>
          </div>
          <div className="small muted" style={{marginBottom:14}}>Izvor: {session.sourceLabel}</div>

          {session.structureCheck.missingOptional.length > 0 && (
            <div className="note-block">Napomena: sledeće opcione kolone nisu pronađene u fajlu i biće tretirane kao prazne: {session.structureCheck.missingOptional.join(", ")}.</div>
          )}

          <div className="stat-row" style={{gridTemplateColumns:"repeat(5,1fr)"}}>
            <div className="stat"><div className="label">Ukupno redova</div><div className="value">{session.preview.totalRows}</div></div>
            <div className="stat"><div className="label">Novi nalozi</div><div className="value green">{session.preview.newRows.length}</div></div>
            <div className="stat"><div className="label">Izmenjeni</div><div className="value amber">{session.preview.changedRows.length}</div></div>

          </div>

          {session.preview.missingIds.length > 0 && (
            <div className="note-block">
              {session.preview.missingIds.length} nalog(a) iz baze ne postoji u novom fajlu. <b>Neće biti obrisani</b>, samo označeni kao „nije prisutan u poslednjem uvozu“: {session.preview.missingIds.slice(0,8).join(", ")}{session.preview.missingIds.length>8?" …":""}
            </div>

            <>
              <div className="section-title" style={{margin:"18px 0 8px"}}><h2>Promene rokova i podataka</h2><div className="rule"></div></div>
              <div className="table-wrap" style={{maxHeight:260,overflowY:"auto"}}>
                {session.preview.changedRows.map((c,i) => (
                  <div key={i} className="diff-row">
                    <span className="mono" style={{fontWeight:600,width:100}}>{c.mapped.order_id}</span>
                    <div style={{flex:1}}>

                        </div>
                      ))}
                    </div>

            <>
              <div className="section-title" style={{margin:"18px 0 8px"}}><h2>Greške u redovima</h2><div className="rule"></div></div>
              <div className="table-wrap" style={{maxHeight:200,overflowY:"auto"}}>

  );

/* ============================================================
   ISO WEEK helper (za "Nedelja X" chip)
   ============================================================ */
function isoWeekNumber(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const diff = date - firstThursday;
  return 1 + Math.round(diff / (7*86400000));
}

/* ============================================================
   PUBLIC SEARCH — vođena pretraga za dilere i kupce (bez logina)
   Suština: dileri (posebno P&G / Pick&Go mreža) često ne znaju
   broj naloga napamet, ali znaju SVOJU Oznaku (interni tag naloga)
   ili ime. Ovaj flow ih vodi kroz kategorije da suzi pretragu.
   ============================================================ */
function categorizePublicOrders(orders){
  const list = Object.values(orders);
  // Prepoznaje i stari zapis ("Pick And Go dileri") i novi ("06-P&G", "07-P&G"...)
  const isDealerArea = ba => /p\s*&\s*g/i.test(ba || "") || /pick\s*and\s*go/i.test(ba || "");
  const dealers = list.filter(o => isDealerArea(o.business_area));
  // "Ostali kupci" = sve ostalo, izuzev dilera i "Zaposleni" (interne narudžbine zaposlenih)
  const others = list.filter(o => !isDealerArea(o.business_area) && o.business_area !== "Zaposleni");
  return { dealers, others };
}

function searchByOrderId(pool, q){
  const s = q.toLowerCase().trim();
  if(!s) return [];
  return pool.filter(o => o.order_id.toLowerCase().includes(s) || (o.order_label||"").toLowerCase().includes(s));
}

function PublicResultsTable({ rows, history, onSelect, showOznaka, forDealer }){
  const dateLabel = forDealer ? "Datum isporuke" : "Datum montaže";
  if(rows.length === 0){
    return <div className="pub-empty"><b>Nismo pronašli nalog.</b>Proverite broj naloga ili oznaku i pokušajte ponovo.</div>;
  }
  return (
    <>
      <table className="pub-results-table desktop-only">
        <thead>
          <tr>
            <th>Broj naloga</th>
            <th>Naziv</th>
            {showOznaka && <th>Oznaka</th>}
            <th>{dateLabel}</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          {rows.slice(0,150).map(o => {
            const st = installationStatus(o.installation_date, forDealer);
            const changed = hasRecentDateChange(history, o.order_id);
            return (
              <tr key={o.order_id} onClick={()=>onSelect(o.order_id)}>
                <td className="mono" style={{fontWeight:600}}>{o.order_id}</td>
                <td>{fullName(o)}</td>
                {showOznaka && <td className="muted">{o.order_label || "—"}</td>}
                <td className="mono">{formatSr(o.installation_date) || "—"}</td>
                <td>
                  <StatusBadge status={st} />
                  {changed && <div className="xsmall" style={{color:"var(--steel)",marginTop:4}}>Termin ažuriran</div>}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <div className="mobile-cards">
        {rows.slice(0,150).map(o => {
          const st = installationStatus(o.installation_date, forDealer);
          const changed = hasRecentDateChange(history, o.order_id);
          return (
            <div key={o.order_id} className="pub-result-card" onClick={()=>onSelect(o.order_id)}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                <span className="mono" style={{fontWeight:600}}>{o.order_id}</span>
                <StatusBadge status={st} />
              </div>
              <div className="small">{fullName(o)}</div>
              {showOznaka && o.order_label && <div className="xsmall muted">Oznaka: {o.order_label}</div>}
              <div className="xsmall muted" style={{marginTop:4}}>{dateLabel}: {formatSr(o.installation_date) || "nije određeno"}</div>
              {changed && <div className="xsmall" style={{color:"var(--steel)",marginTop:2}}>Termin ažuriran</div>}
            </div>
          );
        })}
      </div>
      {rows.length > 150 && <div className="pub-footnote">Prikazano prvih 150 od {rows.length} rezultata. Suzite pretragu za ostale.</div>}
    </>
  );
}

function PublicSearchScreen({ title, forDealer, pool, history, onSelect, onBack }){
  const [q, setQ] = useState("");
  const rows = q.trim().length === 0 ? [] : searchByOrderId(pool, q);
  const word = forDealer ? "isporuke" : "montaže";
  return (
    <div className="pub-main">
      <button className="pub-back" onClick={onBack}>← Nazad</button>
      <div className="pub-eyebrow">{title}</div>
      <h1 className="pub-h1" style={{fontSize:30}}>Gde je Vaš nalog?</h1>
      <p className="pub-lead">Unesite broj naloga ili oznaku, i za par sekundi vidite status i planiran datum {word}.</p>
      <div className="pub-panel">
        <div className="pub-search-row" style={{marginBottom:20}}>
          <input type="text" placeholder="npr. N6P33868 ili DARKO" value={q} onChange={e=>setQ(e.target.value)} autoFocus />
        </div>
        {q.trim().length === 0
          ? <div className="pub-empty"><b>Unesite broj naloga ili oznaku gore</b>npr. N6P33868 ili DARKO</div>
          : <PublicResultsTable rows={rows} history={history} onSelect={onSelect} showOznaka forDealer={forDealer} />
        }
      </div>
    </div>
  );
}

        <div className="pub-choice-grid">
          <button className="pub-choice-card" onClick={()=>setStep("dealers")}>

            <p>Pick&amp;Go dileri, pratite datum isporuke.</p>
            <div className="pub-choice-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
          </button>
          <button className="pub-choice-card" onClick={()=>setStep("others")}>
            <span className="pub-choice-num">02</span>
            <h3>Ostali kupci</h3>
            <p>Fizička lica i ostali kupci, pratite datum montaže.</p>
            <div className="pub-choice-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>

      <PublicSearchScreen title="Ostali kupci" forDealer={false} pool={cats.others} history={history} onSelect={setSelectedId} onBack={()=>setStep("welcome")} />

  return (
    <div className="public-app">
      <div className="pub-topbar">
