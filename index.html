          <div className="pub-week-chip"><span className="dot"></span>Nedelja <b>{isoWeekNumber(now)}</b> · {now.getFullYear()}.</div>
          <button className="pub-admin-link" onClick={onAdminClick}>Administracija</button>
        </div>
      </div>
      {screen}
      {selectedId && (
        <Modal title="Detalji naloga" onClose={()=>setSelectedId(null)} wide>
          <CustomerOrderDetail order={orders[selectedId]} setView={()=>setSelectedId(null)} recentDateChange={getRecentDateChange(history, selectedId)} forDealer={forDealer} />
        </Modal>
      )}
    </div>
  );
}

function isoNow(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

const INVERSE_COLUMN_MAP = Object.fromEntries(Object.entries(COLUMN_MAP).map(([k,v]) => [v,k]));

function buildRawFromMapped(o){
  const raw = {};
  Object.entries(INVERSE_COLUMN_MAP).forEach(([field, src]) => {
    raw[src] = o[field] == null ? "" : o[field];
  });
  return raw;
}

function initialOrders(){
  const map = {};
  RAW_ORDERS.forEach(o => {
    map[o.order_id] = { ...o, raw_data: buildRawFromMapped(o), not_present_in_last_import:false,
      customer_visible_note_flag:false, customer_visible_area:false, source_file:"ROK - Isporuke.xlsx", source_import_id:"IMP-0001" };
  });
  return map;
}

function initialImportLog(){
  const d = new Date(); d.setDate(d.getDate()-1);
  const p = n => String(n).padStart(2,"0");
  const dateStr = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T07:12`;
  return [{
    id:"IMP-0001", date: dateStr, source:"ROK - Isporuke.xlsx (početni uvoz)", status:"SUCCESS",
    rows_total: RAW_ORDERS.length, new_count: RAW_ORDERS.length, updated_count:0, unchanged_count:0, error_count:0,
    admin:"admin@sunce-marinkovic.rs"
  }];
}

/* ============================================================
   APP
   ============================================================ */
function App(){
  const [session, setSession] = useState(null);
  const [view, setView] = useState({ view:"dashboard" });
  const [mobileOpen, setMobileOpen] = useState(false);
  const [orders, setOrders] = useState(initialOrders);
  const [customers, setCustomers] = useState(() => RAW_CUSTOMERS.map(c => ({...c, notify_channel: c.notify_channel || "sms"})));
  const [history, setHistory] = useState({});
  const [importLog, setImportLog] = useState(initialImportLog);
  const [auditLog, setAuditLog] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [liveSync, setLiveSync] = useState({ status:"loading" }); // loading | success | error

  /* Živo učitavanje pri otvaranju: pokušava da povuče trenutno stanje
     sa Google Sheets-a. Ako ne uspe (mreža, dozvole), portal ostaje na
     poslednjem poznatom stanju (ugrađeni podaci) — nikad ne ostaje prazan. */
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try{
        const res = await fetch(LIVE_SHEET_CSV_URL, { cache:"no-store" });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const csvText = await res.text();
        const { header, dataRows } = ExcelImportService.readFromCsvText(csvText);
        const structureCheck = ExcelImportService.validateStructure(header);
        if(!structureCheck.ok) throw new Error("nevalidna struktura");
        const preview = ExcelImportService.buildPreview(header, dataRows, {});
        if(cancelled) return;
        const map = {};
        preview.newRows.forEach(m => {
          map[m.order_id] = { ...m, raw_data:m.raw_data, not_present_in_last_import:false,
            customer_visible_note_flag:false, customer_visible_area:false,
            source_file:"Google Sheets — Rokovi (P&G dileri)", source_import_id:"IMP-0001" };
        });
        setOrders(map);
        setImportLog([{
          id:"IMP-0001", date: isoNow(), source:"Google Sheets — Rokovi (P&G dileri)", status:"SUCCESS",
          rows_total: preview.totalRows, new_count: preview.newRows.length, updated_count:0, unchanged_count:0,
          error_count: preview.errorRows.length, admin:"—"
        }]);
        setLiveSync({ status:"success", rows: preview.newRows.length });
      }catch(err){
        if(!cancelled) setLiveSync({ status:"error", message: err.message || "nepoznata greška" });
      }
    })();
    return () => { cancelled = true; };
  }, []);

  const logAudit = (action, object, detail) => {
    setAuditLog(l => [{ user: session?.role==="admin" ? "admin@sunce-marinkovic.rs" : session?.customerId, action, date: isoNow(), object, detail }, ...l]);
  };

  const [showAdminLogin, setShowAdminLogin] = useState(false);
  const handleLogin = (s) => { setSession(s); setShowAdminLogin(false); setView({view:"dashboard"}); };
  const handleLogout = () => { setSession(null); setShowAdminLogin(false); setView({view:"dashboard"}); };

  const addCustomer = (form) => {
    const nextNum = customers.length + 1;
    const id = "C" + String(nextNum).padStart(4,"0");
    setCustomers(cs => [...cs, { id, name:form.name, email:form.email||"", phone:form.phone||"", order_ids:[] }]);
    logAudit("CREATE_CUSTOMER", id, form.name);
  };
  const updateCustomerContact = (customerId, contact) => {
    setCustomers(cs => cs.map(c => c.id===customerId ? {...c, name:contact.name||c.name, email:contact.email, phone:contact.phone, notify_channel: contact.notify_channel || c.notify_channel, notify_email: contact.notify_email} : c));
    logAudit("UPDATE_CUSTOMER_CONTACT", customerId, contact.email || "(bez email-a)");
  };
  const assignOrder = (customerId, orderId) => {
    setCustomers(cs => cs.map(c => c.id===customerId && !c.order_ids.includes(orderId) ? {...c, order_ids:[...c.order_ids, orderId]} : c));
    logAudit("ASSIGN_ORDER", orderId, `→ ${customerId}`);
  };
  const unassignOrder = (customerId, orderId) => {
    setCustomers(cs => cs.map(c => c.id===customerId ? {...c, order_ids:c.order_ids.filter(x=>x!==orderId)} : c));
    logAudit("UNASSIGN_ORDER", orderId, `✕ ${customerId}`);
  };
  const toggleVisibility = (orderId, field) => {
    setOrders(os => ({ ...os, [orderId]: { ...os[orderId], [field]: !os[orderId][field] } }));
  };

  const runImport = (preview, sourceLabel) => {
    const importId = "IMP-" + String(importLog.length + 1).padStart(4,"0");
    const changedAt = isoNow();
    const newHistoryEntries = {};
    const newNotifications = [];

    setOrders(os => {
      const next = { ...os };
      preview.newRows.forEach(m => {
        next[m.order_id] = { ...m, raw_data:m.raw_data, not_present_in_last_import:false, customer_visible_note_flag:false, customer_visible_area:false, source_file:sourceLabel, source_import_id:importId };
      });
      preview.changedRows.forEach(({mapped, diffs}) => {
        const prev = next[mapped.order_id];
        next[mapped.order_id] = { ...prev, ...mapped, raw_data:mapped.raw_data, not_present_in_last_import:false, source_file:sourceLabel, source_import_id:importId,
          customer_visible_note_flag: prev.customer_visible_note_flag, customer_visible_area: prev.customer_visible_area };
        newHistoryEntries[mapped.order_id] = diffs.map(d => ({ ...d, changed_at: changedAt, import_id: importId }));

        const dateDiff = diffs.find(d => d.field === "installation_date");
        if(dateDiff){
          const cust = customerForOrder(customers, mapped.order_id);
          if(cust){
            newNotifications.push(...NotificationService.buildForDeadlineChange({
              customer: cust, orderId: mapped.order_id, oldDate: dateDiff.old, newDate: dateDiff.new, importId
            }));
          }
        }
      });
      preview.unchangedRows.forEach(m => { next[m.order_id] = { ...next[m.order_id], not_present_in_last_import:false }; });
      preview.missingIds.forEach(id => { if(next[id]) next[id] = { ...next[id], not_present_in_last_import:true }; });
      return next;
    });

    setHistory(h => {
      const next = { ...h };
      Object.entries(newHistoryEntries).forEach(([oid, entries]) => { next[oid] = [...(next[oid]||[]), ...entries]; });
      return next;
    });

    setImportLog(l => [{
      id: importId, date: isoNow(), source: sourceLabel, status:"SUCCESS",
      rows_total: preview.totalRows, new_count: preview.newRows.length, updated_count: preview.changedRows.length,
      unchanged_count: preview.unchangedRows.length, error_count: preview.errorRows.length, admin:"admin@sunce-marinkovic.rs"
    }, ...l]);

    if(newNotifications.length) setNotifications(n => [...newNotifications, ...n]);

    logAudit("IMPORT", sourceLabel, `${preview.totalRows} redova: ${preview.newRows.length} novih, ${preview.changedRows.length} izmenjenih, ${preview.errorRows.length} grešaka`);
  };

  const handleSendNotification = async (n) => {
    const result = await sendNotification(n);
    setNotifications(ns => ns.map(x => x.id === n.id
      ? (result.ok
          ? { ...x, sent:true, status:"SPREMNO ZA SLANJE", error:null, sent_at: isoNow(), message_id: result.messageId }
          : { ...x, sent:false, status:"GREŠKA", error: result.error })
      : x
    ));
    logAudit(result.ok ? "SEND_NOTIFICATION_OK" : "SEND_NOTIFICATION_FAIL", n.id, result.ok ? (n.channel + " → " + (n.email||n.phone)) : result.error);
  };

  if(!session || session.role !== "admin"){
    if(showAdminLogin){
      return <AdminLoginScreen onLogin={handleLogin} onBack={()=>setShowAdminLogin(false)} />;
    }
    return <PublicSearch orders={orders} history={history} onAdminClick={()=>setShowAdminLogin(true)} liveSync={liveSync} />;
  }

  const titles = {
    dashboard: "Pregled",
    orders: "Svi nalozi",
    "order-detail": "Detalji naloga",
    customers: "Kupci",
    notifications: "Notifikacije",
    import: "Uvoz podataka",
    "import-history": "Istorija uvoza",
    settings: "Podešavanja",
  };

  let body = null;
  if(view.view === "orders") body = <AdminOrders orders={orders} setView={setView} />;
  else if(view.view === "order-detail") body = <AdminOrderDetail order={orders[view.orderId]} history={history} customers={customers} setView={setView} toggleVisibility={toggleVisibility} />;
  else if(view.view === "customers") body = <CustomerManagement customers={customers} orders={orders} addCustomer={addCustomer} assignOrder={assignOrder} unassignOrder={unassignOrder} updateCustomerContact={updateCustomerContact} />;
  else if(view.view === "notifications") body = <NotificationsPage notifications={notifications} onSend={handleSendNotification} />;
  else if(view.view === "import") body = <ImportCenter orders={orders} importLog={importLog} runImport={runImport} />;
  else if(view.view === "import-history") body = <ImportHistoryPage importLog={importLog} />;
  else if(view.view === "settings") body = <SettingsPage />;
  else body = <AdminDashboard orders={orders} importLog={importLog} history={history} setView={setView} />;

  return (
    <div className="shell">
      {mobileOpen && <div onClick={()=>setMobileOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.3)",zIndex:35}}></div>}
      <Sidebar session={session} view={view} setView={setView} onLogout={handleLogout} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />
      <div className="main">
        <Topbar title={titles[view.view] || ""} setMobileOpen={setMobileOpen}
          right={<span className="small muted">admin@sunce-marinkovic.rs</span>} />
        <div className="content">{body}</div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
